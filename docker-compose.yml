services:
  rutv-middleware:
    image: ghcr.io/antonsheinin/rutv-middleware:latest
    build: .
    container_name: rutv-middleware
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - playlist-network

  rutv-middleware-mcp:
    image: ghcr.io/antonsheinin/rutv-middleware:latest
    build: .
    container_name: rutv-middleware-mcp
    command: ["python", "-m", "app.mcp_server"]
    ports:
      - "8091:8091"
    environment:
      RUTV_MIDDLEWARE_API_URL: http://rutv-middleware:8080
      RUTV_MIDDLEWARE_API_KEY: ${INTEGRATION_API_KEY}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8091
    depends_on:
      rutv-middleware:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - playlist-network

  postgres:
    image: postgres:15-alpine
    container_name: playlist-postgres
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - playlist-network

volumes:
  postgres_data:

networks:
  playlist-network:
    driver: bridge
